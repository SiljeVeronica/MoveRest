<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Basic Meta Tags for Character Encoding and Responsive Design -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MoveRest - Track Your Wellbeing</title>
    <!-- Link to our external CSS stylesheet for modern styling -->
    <link rel="stylesheet" href="style.css">
    <!--Using the same general architecture as in the rest of the application that we got from ChatGPT https://chatgpt.com/share/6a0b3e8a-7d58-83eb-8d3b-30c26fde583c-->
</head>
<body>
    <div class="app-container">
        <!-- Main Application Header -->
        <header class="header-top">
            <div>
                <h1>MoveRest</h1>
                <p class="subtitle">Track habits, embrace recovery</p>
            </div>
            <!-- Quick Add Button -->
            <button id="manual-add-btn" class="add-btn" aria-label="Add entry">+</button>
        </header>

        <main>
            <!-- Quick Status Registration (Manual Workout Registration Requirement) -->
            <section id="quick-status-section" class="card">
                <h3>How is your day?</h3>
                <div class="status-buttons">
                    <button id="quick-green-btn" class="status-button green" aria-label="Green Day">
                        Green Day
                    </button>
                    <button id="quick-red-btn" class="status-button red" aria-label="Red Day">
                        Red Day
                    </button>
                </div>

                <!-- Red Reasons: Shown only if 'Red Day' is selected -->
                <div id="quick-red-reasons" class="reason-buttons hidden">
                    <button class="reason-button" data-reason="Pain">Pain</button>
                    <button class="reason-button" data-reason="Discomfort">Discomfort</button>
                    <button class="reason-button" data-reason="Low Energy">Low Energy</button>
                </div>

                <!-- Feedback Box: Recommendations based on status -->
                <div id="feedback-display" class="feedback-box empty">
                    <p id="feedback-text">Register your status to get feedback...</p>
                </div>
            </section>

            <!-- Calendar Section: Displays the monthly view and navigation -->
            <section id="calendar-section" class="card">
                <div class="calendar-header">
                    <!-- Navigation buttons for previous and next month -->
                    <button id="prev-month">&lt;</button>
                    <h2 id="current-month-year"></h2>
                    <button id="next-month">&gt;</button>
                </div>
                <!-- Static Header for Days of the Week -->
                <div class="calendar-days-header">
                    <span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span><span>Sun</span>
                </div>
                <!-- Dynamic Grid where days will be injected by JavaScript -->
                <div id="calendar-grid" class="calendar-grid">
                    <!-- Calendar cells will be injected here by app.js -->
                </div>
            </section>
        </main>

        <!-- Registration Modal: Detailed entry form -->
        <div id="registration-modal" class="modal hidden">
            <div class="modal-content">
                <span id="close-reg-modal" class="close-btn">&times;</span>
                
                <div id="step-1" class="modal-step">
                    <h3>New Entry</h3>
                    <div class="modal-status-toggle">
                        <button id="modal-status-green" class="status-mini green selected" aria-label="Green Day">
                            Green Day
                        </button>
                        <button id="modal-status-red" class="status-mini red" aria-label="Red Day">
                            Red Day
                        </button>
                    </div>

                    <form id="entry-form">
                        <!-- Red Reasons in Modal -->
                        <div id="modal-red-reasons" class="form-group hidden">
                            <label>Reason for Red Status:</label>
                            <div class="reason-options">
                                <label><input type="radio" name="modal-reason" value="Pain"> Pain</label>
                                <label><input type="radio" name="modal-reason" value="Discomfort"> Discomfort</label>
                                <label><input type="radio" name="modal-reason" value="Low Energy"> Low Energy</label>
                            </div>
                        </div>

                        <!-- Workout Details -->
                        <div id="workout-details">
                            <div class="form-group">
                                <label for="workout-type">Workout Type:</label>
                                <input type="text" id="workout-type" placeholder="e.g. Running, Walking">
                            </div>
                            <div class="form-group-row">
                                <div class="form-group">
                                    <label for="duration">Duration (min):</label>
                                    <input type="number" id="duration" placeholder="30">
                                </div>
                                <div class="form-group">
                                    <label for="intensity">Intensity:</label>
                                    <select id="intensity">
                                        <option value="easy">Easy</option>
                                        <option value="medium">Medium</option>
                                        <option value="hard">Hard</option>
                                    </select>
                                </div>
                            </div>
                        </div>

                        <!-- General Note -->
                        <div class="form-group">
                            <label for="note">Comment / Note:</label>
                            <textarea id="note" rows="3" placeholder="How did it go?"></textarea>
                        </div>

                        <button type="submit" class="btn btn-primary full-width">Save Entry</button>
                    </form>
                </div>
            </div>
        </div>

        <!-- History Modal: View and delete saved data -->
        <div id="view-data-modal" class="modal hidden">
            <div class="modal-content">
                <span id="close-view-modal" class="close-btn">&times;</span>
                <h3 id="view-date-title">Details</h3>
                
                <div class="view-details-container">
                    <div class="detail-item">
                        <span class="detail-label">Status:</span>
                        <span id="view-status-val" class="detail-val"></span>
                    </div>
                    <div id="view-reason-row" class="detail-item hidden">
                        <span class="detail-label">Reason:</span>
                        <span id="view-reason-val" class="detail-val"></span>
                    </div>
                    <div id="view-workout-row" class="detail-item hidden">
                        <span class="detail-label">Workout:</span>
                        <span id="view-workout-val" class="detail-val"></span>
                    </div>
                    <div id="view-note-row" class="form-group hidden">
                        <label class="detail-label">Note:</label>
                        <div id="view-note-val" class="detail-note-val"></div>
                    </div>
                </div>

                <button id="delete-entry-btn" class="btn-delete full-width">Delete Entry</button>
            </div>
        </div>
    </div>

    <!-- Load our core application logic script -->
    <script src="app.js"></script>
</body>
</html>
